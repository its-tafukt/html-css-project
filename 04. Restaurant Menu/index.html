<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu">

    
        <h1>Olive & Ember</h1>
        <p>KITCHEN MENU</p>

        <div class="menu-items">
            <h1>Starters</h1>
            <hr>
            <ul>
                <li>
                    <span class="item">Tomato Soup</span>
                    <span class="price">$7</span>
                </li>
                <li>
                    <span class="item">Garlic Flatbread</span>
                    <span class="price">$6</span>
                </li>
                <li>
                    <span class="item">Greek Salad</span>
                    <span class="price">$9</span>
                </li>
            </ul>
        </div>

    


        <div class="menu-items">
            <h1>Maims</h1>
            <hr>
            <ul>
                <li>
                    <span class="item">Wood-Fired Pizza</span>
                    <span class="price">$15</span>
                </li>
                <li>
                    <span class="item">Spaghetti Pomodoro</span>
                    <span class="price">$13</span>
                </li>
                <li>
                    <span class="item">Grilled Chicken</span>
                    <span class="price">$17</span>
                </li>
            
            </ul>
        </div>



        <div class="menu-items">
            <h1>Desserts</h1>
            <hr>
            <ul>
                <li>
                    <span class="item">Tiramisu</span>
                    <span class="price">$8</span>
                </li>
                <li>
                    <span class="item">Lemon Sorbet</span>
                    <span class="price">$6</span>
                </li>
            
            
            </ul>
        </div>
    </div>

    
</body>
</html>
