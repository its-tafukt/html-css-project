<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="src/product.jpeg" alt="Product Picture">
        <div class="name">
            <h3>Casquette</h3>
            <p>20 EURO</p>
        </div>
        <div class="rating">
            <p>5/5  </p>
        </div>
        <button>Add To Card</button>
    </div>
    
</body>
</html>
